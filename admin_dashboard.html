<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | MusicMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar .nav-link { color: #adb5bd; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <a href="admin_dashboard.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-bold text-danger">MusicMania Admin</span>
            </a>
            <hr class="text-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="admin_dashboard.html" class="nav-link active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
                </li>
                <li class="admin-only">
                    <a href="admin_productos.html" class="nav-link"><i class="bi bi-disc me-2"></i>Productos</a>
                </li>
                <li class="admin-only">
                    <a href="admin_usuarios.html" class="nav-link"><i class="bi bi-people me-2"></i>Usuarios</a>
                </li>
            </ul>
            <hr class="text-secondary">
            <div class="dropdown">
                <button class="btn btn-outline-light btn-sm w-100" id="btnLogout"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</button>
            </div>
        </nav>

        <!-- Contenido Central -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h1 class="h2" id="welcomeMsg">¡HOLA Administrador!</h1>
            <hr>
            <div class="row g-4 mt-2">
                <div class="col-md-4">
                    <div class="card text-bg-primary p-3">
                        <div class="card-body">
                            <h5 class="card-title">Productos Registrados</h5>
                            <p class="card-text fs-3 fw-bold" id="totalProductos">0</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-bg-success p-3">
                        <div class="card-body">
                            <h5 class="card-title">Usuarios Activos</h5>
                            <p class="card-text fs-3 fw-bold" id="totalUsuarios">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="js/admin_auth.js"></script>
</body>
</html>
