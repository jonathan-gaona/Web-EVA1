<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compras - MusicMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-white">
    <!-- Encabezado -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-danger fs-3" href="index.html">MusicMania</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="catalogo_albumes.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="blog_resenas.html">Blog/Reseñas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre_nosotros.html">Sobre Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                    <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 gap-lg-3 ms-lg-auto">
                        <a class="nav-link" href="iniciar_sesion.html">Iniciar sesión</a>
                        <a class="nav-link" href="registro.html">Registrarse</a>
                        <a class="btn btn-dark btn-sm" href="carrito_compras.html" id="btn-carrito" aria-current="page">Carrito (0)</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Carrito -->
    <main class="container py-5">
        <h1 class="mb-5">Mi carrito de compras</h1>
        <div class="row g-4">
            <!-- Los productos agregados se construirán dinámicamente aquí -->
            <section class="col-lg-8" id="lista-carrito" aria-label="Productos agregados al carrito">
                <p class="text-muted">Cargando productos del carrito...</p>
            </section>

            <!-- Resumen del pedido -->
            <aside class="col-lg-4 cart-summary">
                <div class="border-top border-dark pt-3">
                    <div class="d-flex justify-content-between align-items-center mb-5">
                        <h2 class="h4 mb-0">TOTAL:</h2>
                        <strong class="fs-5" id="total-carrito">$ 0</strong>
                    </div>
                    <label for="cupon" class="form-label small text-muted">Ingrese el cupón de descuento</label>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="cupon" aria-label="Cupón de descuento">
                        <button class="btn btn-outline-secondary" type="button">Aplicar</button>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-success btn-lg fw-bold">PAGAR</button>
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="vaciarCarrito()">Vaciar Carrito</button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/carrito_vista.js"></script>
</body>
</html>
