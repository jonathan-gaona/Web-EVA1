<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicMania - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Header y Menú de navegación -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-danger fs-3" href="index.html">MusicMania</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="catalogo_albumes.html">Catálogo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="blog_reseñas.html">Blog/Reseñas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrito_compras.html">Carrito</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobre_nosotros.html">Sobre Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main class="py-5">
        <div class="container">
            
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    
                    <h2 class="text-center mb-4 fw-bold">Contáctanos</h2>
                    <p class="text-center text-muted mb-4">¿Tienes dudas o consultas? Escríbenos y te responderemos a la brevedad.</p>

                    <!-- Formulario (Requisito 7) -->
                    <form id="formContacto" class="card p-4 shadow-sm tarjeta" onsubmit="validarFormulario(event)">
                        
                        <!-- Input Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre Completo:</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
                        </div>

                        <!-- Input Correo -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Correo Electrónico:</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
                        </div>

                        <!-- Select Asunto -->
                        <div class="mb-3">
                            <label for="asunto" class="form-label fw-bold">Motivo de consulta:</label>
                            <select class="form-select" id="asunto" required>
                                <option value="" selected disabled>Selecciona una opción</option>
                                <option value="consulta">Consulta General</option>
                                <option value="pedido">Estado de mi pedido</option>
                                <option value="sugerencia">Sugerencia</option>
                            </select>
                        </div>

                        <!-- Textarea Mensaje -->
                        <div class="mb-3">
                            <label for="mensaje" class="form-label fw-bold">Mensaje:</label>
                            <textarea class="form-rows-3 form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </div>

                        <!-- Botón Submit -->
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Enviar Mensaje</button>
                    
                    </form>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-1">&copy; 2026 MusicMania - Todos los derechos reservados.</p>
            <p class="small text-muted mb-0">Página hecha por estudiantes.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
