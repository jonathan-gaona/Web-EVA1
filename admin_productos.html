<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Productos - MusicMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <h2>Mantenedor de Productos</h2>
    <a href="admin_dashboard.html" class="btn btn-secondary btn-sm mb-3">Volver al Dashboard</a>

    <!-- Formulario Directo (Sin Modals) -->
    <div class="card p-3 mb-4 bg-light">
        <h4 id="tituloForm">Agregar Producto</h4>
        <form id="formProducto">
            <input type="hidden" id="indexEdit" value="-1">
            
            <div class="row g-2">
                <div class="col-md-3">
                    <label>Código:</label>
                    <input type="text" id="codigo" class="form-control" placeholder="Mínimo 3 caracteres">
                </div>
                <div class="col-md-5">
                    <label>Nombre:</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Máximo 100 caracteres">
                </div>
                <div class="col-md-4">
                    <label>Categoría:</label>
                    <select id="categoria" class="form-select">
                        <option value="">Seleccione...</option>
                        <option value="Vinilos">Vinilos</option>
                        <option value="CDs">CDs</option>
                        <option value="Cassettes">Cassettes</option>
                    </select>
                </div>
                <div class="col-md-4 mt-2">
                    <label>Precio ($):</label>
                    <input type="number" id="precio" class="form-control" value="0">
                </div>
                <div class="col-md-4 mt-2">
                    <label>Stock:</label>
                    <input type="number" id="stock" class="form-control" value="0">
                </div>
                <div class="col-md-4 mt-2">
                    <label>Stock Crítico:</label>
                    <input type="number" id="stockCritico" class="form-control" value="5">
                </div>
            </div>

            <button type="submit" class="btn btn-success mt-3" id="btnGuardar">Guardar Producto</button>
            <button type="button" class="btn btn-outline-danger mt-3" id="btnCancelar" onclick="limpiarFormulario()">Limpiar</button>
        </form>
    </div>

    <!-- Tabla -->
    <h4>Lista de Productos</h4>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
    </table>

    <script src="js/admin_productos.js"></script>
</body>
</html>
