<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | MusicMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Navegación Pública -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-danger" href="index.html">MusicMania</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="registro.html">Registrar usuario</a>
            </div>
        </div>
    </nav>

    <!-- Contenedor del Formulario -->
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-disc-fill text-danger fs-1"></i>
                            <h3 class="fw-bold mt-2">MusicMania</h3>
                            <p class="text-muted">Inicio de sesión</p>
                        </div>

                        <!-- Alerta de Error de Credenciales -->
                        <div id="alertError" class="alert alert-danger d-none" role="alert">
                            Correo o contraseña incorrectos.
                        </div>

                        <form id="formLogin" novalidate>
                            <!-- Campo Correo -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" maxlength="100" placeholder="nombre@duoc.cl" required>
                                <div class="invalid-feedback" id="correoFeedback">
                                    Ingrese un correo válido (@duoc.cl, @profesor.duoc.cl o @gmail.com).
                                </div>
                            </div>

                            <!-- Campo Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" minlength="4" maxlength="10" placeholder="••••••••" required>
                                <div class="invalid-feedback">
                                    La contraseña debe tener entre 4 y 10 caracteres.
                                </div>
                            </div>

                            <!-- Botón de Envío -->
                            <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Iniciar sesión</button>
                        </form>

                        <div class="text-center mt-3">
                            <small class="text-muted">¿No tienes una cuenta? <a href="registro.html" class="text-danger">Regístrate aquí</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
