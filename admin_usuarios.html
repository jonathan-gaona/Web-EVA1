<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Registrar / Editar Usuario</h4>
        </div>
        <div class="card-body">
            <form id="formUsuario" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">RUN (sin puntos ni guion)</label>
                        <input type="text" id="run" class="form-control" placeholder="19011022K" required>
                        <div class="invalid-feedback">Formato de RUN inválido (7-9 caracteres).</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de Usuario (Rol)</label>
                        <select id="rol" class="form-select" required>
                            <option value="Cliente">Cliente</option>
                            <option value="Vendedor">Vendedor</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" maxlength="50" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text" id="apellidos" class="form-control" maxlength="100" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" id="correo" class="form-control" maxlength="100" placeholder="usuario@duoc.cl" required>
                        <div class="invalid-feedback">Debe ser @duoc.cl, @profesor.duoc.cl o @gmail.com.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Región</label>
                        <select id="region" class="form-select" required>
                            <option value="">Seleccione Región...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Comuna</label>
                        <select id="comuna" class="form-select" required disabled>
                            <option value="">Seleccione Comuna...</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control" maxlength="300" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4">Guardar Usuario</button>
            </form>
        </div>
    </div>
</div>

<script src="js/regiones_comunas.js"></script>
<script src="js/admin_usuarios.js"></script>
</body>
</html>
